<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profiling et Qualité des Données</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        .chart-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            width: 95%;
            margin: 0 auto;
        }
        
        .chart-wrapper {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .chart-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }
        
        @media (max-width: 768px) {
            .chart-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="index.html">Clinique</a></li>
            <li><a href="doctorPerformance.html">Médecin</a></li>
            <li><a href="simulator.html">Rentabilité</a></li>
            <li><a href="ProfilingAndQdd.html" class="active">Profiling & Qualité</a></li>
        </ul>
    </nav>

    <!-- Section Profiling Patients -->
    <section style="margin: 40px auto; max-width: 90%; background-color: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);">
        <h1 class="title">Profiling Patients</h1>
        
        <div class="chart-container">
            <!-- Graphique de répartition par genre -->
            <div class="chart-wrapper">
                <div class="chart-title">Répartition par Genre</div>
                <div id="gender-chart"></div>
            </div>
            
            <!-- Graphique de répartition par tranche d'âge -->
            <div class="chart-wrapper">
                <div class="chart-title">Répartition par Tranche d'Âge</div>
                <div id="age-groups-chart"></div>
            </div>
        </div>
    </section>

    <!-- Section Qualité des Données -->
    <section style="margin: 40px auto; max-width: 90%; background-color: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);">
        <h1 class="title">Qualité des Données</h1>
        <div style="padding: 20px;">
            <!-- Contenu de la qualité des données à venir -->
            <p style="text-align: center; color: #666;">Contenu à venir...</p>
        </div>
    </section>

    <script src="profiling/profiling.js"></script>
</body>
</html>
