<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-container">
    <!-- Ajout du logo -->
    <img src="logo.png" alt="Logo de l'application">
    
    <h2>Connexion</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Nom d'utilisateur" required>
      <input type="password" id="password" placeholder="Mot de passe" required>
      <button type="submit">Se connecter</button>
    </form>
    <div id="message"></div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('http://localhost:3000/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          // Stocker le token JWT dans le localStorage
          localStorage.setItem('token', data.token);
          // Rediriger vers index.html après succès de la connexion
          window.location.href = 'index.html';
        } else {
          document.getElementById('message').textContent = 'Erreur : ' + (data.error || 'Connexion échouée');
        }
      } catch (error) {
        console.error('Erreur lors de la connexion', error);
        document.getElementById('message').textContent = 'Erreur lors de la connexion.';
      }
    });
  </script>
</body>
</html>
